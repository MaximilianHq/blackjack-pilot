<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blackjack Pilot</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="title-row">
        <span class="logo">🃏</span>
        <h1>Blackjack Pilot</h1>
        <span class="badge">v2 Pro</span>
      </div>
      <div id="serverStatus" class="status-indicator disconnected">
        <span class="status-dot"></span>
        <span class="status-text">Server: Disconnected</span>
      </div>
    </header>

    <!-- Main Capture Controls -->
    <section class="section">
      <button id="btnToggleCapture" class="btn btn-primary btn-large">
        ▶ Start Browser Capture
      </button>
    </section>

    <!-- Zone Selection Bar -->
    <section class="section">
      <div class="section-title">Table Calibration</div>
      <div class="btn-grid">
        <button id="btnSelectFeed" class="btn btn-secondary">📹 1. Feed Area</button>
        <button id="btnSelectDealer" class="btn btn-secondary">👑 2. Dealer Zone</button>
        <button id="btnSelectPlayer" class="btn btn-secondary">👤 3. Player Zone</button>
        <button id="btnResetZones" class="btn btn-secondary">↺ Clear Zones</button>
      </div>
      <div class="zone-status-bar">
        <span id="txtFeedStatus">Feed: None</span>
        <span id="txtDealerStatus">Dealer: None</span>
        <span id="txtPlayerStatus">Player: None</span>
      </div>
    </section>

    <!-- HUD Overlay Options -->
    <section class="section">
      <div class="section-title">HUD Overlay</div>
      <div class="toggle-row">
        <span>In-Browser HUD</span>
        <label class="switch">
          <input type="checkbox" id="chkShowHud" checked>
          <span class="slider round"></span>
        </label>
      </div>
      <div class="toggle-row">
        <span>Draw Card Bounding Boxes</span>
        <label class="switch">
          <input type="checkbox" id="chkDrawBoxes" checked>
          <span class="slider round"></span>
        </label>
      </div>
    </section>

    <!-- Detection Settings -->
    <section class="section">
      <div class="section-title">AI Sensitivity</div>
      <div class="control-row">
        <label for="rangeConf">Confidence:</label>
        <input type="range" id="rangeConf" min="10" max="90" value="35">
        <span id="valConf" class="val-label">35%</span>
      </div>
      <div class="control-row">
        <label for="rangeIou">Overlap (IoU):</label>
        <input type="range" id="rangeIou" min="20" max="80" value="50">
        <span id="valIou" class="val-label">50%</span>
      </div>
      <div class="control-row">
        <label for="spinDecks">Decks Remaining:</label>
        <input type="number" id="spinDecks" min="1" max="8" value="6" class="number-input">
      </div>
    </section>

    <!-- Quick Actions -->
    <section class="section action-footer">
      <button id="btnResetCounter" class="btn btn-outline">Reset Hi-Lo Count</button>
      <button id="btnResetStats" class="btn btn-outline">Reset Statistics</button>
    </section>
  </div>

  <script src="popup.js"></script>
</body>
</html>
